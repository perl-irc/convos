# ABOUTME: Atheme configuration for XMLRPC and IRC testing
# ABOUTME: Minimal configuration providing NickServ with XMLRPC endpoint and IRC uplink for integration tests

loadmodule "modules/protocol/ngircd";
loadmodule "modules/misc/httpd";
loadmodule "modules/transport/xmlrpc";
loadmodule "modules/nickserv/main";
loadmodule "modules/nickserv/register";
loadmodule "modules/nickserv/identify";
loadmodule "modules/nickserv/info";
loadmodule "modules/nickserv/verify";
loadmodule "modules/nickserv/set_core";
loadmodule "modules/nickserv/set_hidemail";

serverinfo {
    name = "services.test";
    desc = "Test Atheme Services";
    netname = "TestNet";
    numeric = "00A";
};

uplink "irc.test" {
    host = "ngircd";
    port = 6667;
    send_password = "linkpass";
    receive_password = "linkpass";
};

general {
    commit_interval = 5;
};

httpd {
    host = "0.0.0.0";
    port = 8080;
};

nickserv {
    nick = "NickServ";
    user = "NickServ";
    host = "services.test";
    real = "Nickname Services";
    no_nick_ownership;
};
