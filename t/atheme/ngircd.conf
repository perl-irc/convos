# ABOUTME: ngIRCd configuration for Atheme integration testing
# ABOUTME: Minimal IRC server config with services uplink support

[Global]
	Name = irc.test
	AdminInfo1 = Test IRC Server
	AdminInfo2 = For Atheme Testing
	AdminEMail = test@example.com
	Info = Test IRC Server for Atheme Services
	Listen = 0.0.0.0
	MotdFile = /dev/null
	ServerUID = 001
	ServerGID = 001

[Limits]
	MaxConnections = 100
	MaxJoins = 10
	PingTimeout = 120

[Options]
	AllowRemoteOper = no
	DNS = no
	Ident = no
	PAM = no

# Server link for Atheme services
[Server]
	Name = services.test
	Host = atheme
	Port = 6667
	MyPassword = linkpass
	PeerPassword = linkpass
	ServiceMask = *Serv
